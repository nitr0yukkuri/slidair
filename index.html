<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="静かなプレゼンテーション背景ジェネレーター" />
    <title>slide-atmosphere</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div>
          <p class="eyebrow">AMBIENT PRESENTATION SYSTEM</p>
          <h1>slide-atmosphere</h1>
          <p class="intro">季節と時間帯、天気、スライドの役割から、発表の空気をつくる。</p>
        </div>
        <p class="status" id="status" role="status">manual preset</p>
      </header>

      <section class="workspace" aria-label="プレゼン背景プレビュー">
        <div class="preview-wrap">
          <article class="slide" id="slide" data-season="autumn" data-period="night" data-weather="clear" data-role="cover">
            <div class="atmosphere atmosphere-base"></div>
            <div class="atmosphere atmosphere-light"></div>
            <div class="atmosphere atmosphere-weather"></div>
            <div class="atmosphere atmosphere-vignette"></div>
            <svg class="atmosphere atmosphere-noise" aria-hidden="true" preserveAspectRatio="none">
              <filter id="grain">
                <feTurbulence type="fractalNoise" baseFrequency="0.78" numOctaves="3" stitchTiles="stitch" />
                <feColorMatrix type="saturate" values="0" />
              </filter>
              <rect width="100%" height="100%" filter="url(#grain)" />
            </svg>
            <span class="season-mark" aria-hidden="true"></span>
            <div class="slide-content">
              <p class="slide-kicker" id="role-label">COVER / 01</p>
              <h2 id="slide-title">背景は、発表の空気をつくる。</h2>
              <p class="slide-copy" id="slide-copy">文字より前に立たず、でも何もないわけではない。静かな環境としてのプレゼンテーション背景。</p>
            </div>
            <p class="slide-meta" id="slide-meta">autumn · night · clear</p>
          </article>
        </div>

        <aside class="controls" aria-label="背景設定">
          <div class="control-group">
            <label for="season">季節</label>
            <select id="season">
              <option value="spring">春</option>
              <option value="summer">夏</option>
              <option value="autumn" selected>秋</option>
              <option value="winter">冬</option>
            </select>
          </div>

          <div class="control-group">
            <label for="period">時間帯</label>
            <select id="period">
              <option value="morning">朝</option>
              <option value="day">昼</option>
              <option value="evening">夕方</option>
              <option value="night" selected>夜</option>
            </select>
          </div>

          <div class="control-group">
            <label for="weather">天気</label>
            <select id="weather">
              <option value="clear" selected>晴れ</option>
              <option value="cloudy">曇り</option>
              <option value="rain">雨</option>
              <option value="snow">雪</option>
            </select>
          </div>

          <div class="control-group">
            <label for="role">スライドの役割</label>
            <select id="role">
              <option value="cover" selected>表紙</option>
              <option value="section">区切り</option>
              <option value="content">本文</option>
              <option value="quote">引用・メッセージ</option>
              <option value="closing">締め</option>
            </select>
          </div>

          <div class="control-actions">
            <button type="button" id="now">現在時刻を反映</button>
            <button type="button" class="button-secondary" id="copy-url">この状態のURLをコピー</button>
          </div>

          <p class="note">季節はスライド下部の低彩度の色だけで表現します。本番では状態を固定したURLまたは書き出し画像を使う想定です。</p>
        </aside>
      </section>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
